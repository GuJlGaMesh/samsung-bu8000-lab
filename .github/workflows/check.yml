name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python tools/generate_cleanup.py
      - run: for script in build/cleanup/*.sh tv/*.sh; do bash -n "$script"; done
      - run: for script in guard/service/*.js; do node --check "$script"; done
      - run: python tools/check_public_tree.py
